name: Publish to npm

# The code rail. Tag a version and push the tag:
#
#   npm version minor && git push --follow-tags
#
# Setup: add an NPM_TOKEN repository secret (an npm automation token with
# publish rights on the scope). Provenance needs nothing beyond `id-token: write`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and verify without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The tag is the source of truth for the version. A mismatch here means the
      # published package would report a version nobody can find in git.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          CFG="$(node -p "require('./mcp.config.json').server.version")"
          echo "tag=$TAG package.json=$PKG mcp.config.json=$CFG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }
          [ "$TAG" = "$CFG" ] || { echo "::error::tag $TAG != mcp.config.json server.version $CFG"; exit 1; }

      # Refresh the bundled offline fallback from the tagged content, so a
      # released package's snapshot is never older than the release itself.
      - name: Refresh the bundled snapshot
        run: node scripts/build-catalog.mjs --snapshot

      - run: npm run verify

      - name: Pack and show what ships
        run: |
          npm pack --dry-run
          npm pack --silent | tail -1 | xargs -I{} sh -c 'echo "tarball: {} ($(du -h {} | cut -f1))"'

      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report
        if: ${{ github.event_name == 'push' || inputs.dry-run == false }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`$NAME@$VERSION\`"
            echo
            echo 'Users add it with no server involved:'
            echo
            echo '```json'
            echo "{ \"mcpServers\": { \"$(node -p "require('./mcp.config.json').server.name")\": { \"command\": \"npx\", \"args\": [\"-y\", \"$NAME\"] } } }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
